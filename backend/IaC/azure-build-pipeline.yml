trigger:
  branches:
    include:
      - master
      - dev
      - qa
  paths:
    include:
      - backend/*
    exclude:
      - frontend/*
      - infrastructure/*
  batch: true

pr:
  branches:
    include:
      - master
      - dev
      - qa
  paths:
    include:
      - backend/*
    exclude:
      - frontend/*
      - infrastructure/*

pool: Default

variables:
  buildConfiguration: "Release"
  dotnetVersion: "8.0.x"

stages:
  - stage: "Build"
    displayName: "Build Stage"
    jobs:
      - job: "BuildApp"
        displayName: "Build ASP.NET Core 8 Application"
        steps:
          # Install the specified .NET SDK version
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              version: "$(dotnetVersion)"
              includePreviewVersions: true
              performMultiLevelLookup: true

          # Restore dependencies
          - script: |
              echo "##[section]Restoring project dependencies"
              dotnet restore backend/src/UniversityManagementSystem.API/UniversityManagementSystem.API.csproj
            displayName: "Restore Dependencies"

          # Build the project
          - script: |
              echo "##[section]Building the project"
              dotnet build backend/src/UniversityManagementSystem.API/UniversityManagementSystem.API.csproj \
                --configuration $(buildConfiguration) --no-restore
            displayName: "Build Project"

          # Run unit tests
          - script: |
              echo "##[section]Running unit tests"
              dotnet test backend/src/UniversityManagementSystem.API/UniversityManagementSystem.API.csproj \
                --configuration $(buildConfiguration) --no-build --verbosity normal
            displayName: "Run Tests"

          # Publish the application
          - script: |
              echo "##[section]Publishing the application"
              dotnet publish backend/src/UniversityManagementSystem.API/UniversityManagementSystem.API.csproj \
                -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)
            displayName: "Publish Application"

          # Publish build artifacts
          - task: PublishBuildArtifacts@1
            displayName: "Publish Build Artifacts"
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)"
              artifactName: "UniversityManagementSystem.API-build"
              publishLocation: "Container"
