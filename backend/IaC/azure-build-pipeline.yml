trigger:
  branches:
    include:
      - master
      - dev
      - qa
  paths:
    include:
      - backend/*
    exclude:
      - frontend/*
      - infrastructure/*
  batch: true

pr:
  branches:
    include:
      - master
      - dev
      - qa
  paths:
    include:
      - backend/*
    exclude:
      - frontend/*
      - infrastructure/*

pool: Default # ✅ Use Microsoft-hosted agent (if no self-hosted agent)

variables:
  buildConfiguration: "Release"
  dotnetVersion: "8.0.x"
  mainProjectLocation: "backend/src/UniversityManagementSystem.API/UniversityManagementSystem.API.csproj"
  testProjectLocation: "backend/test/UniversityManagementSystem.Test/UniversityManagementSystem.Test.csproj"
  azureSubscription: "azure-connect"

stages:
  - stage: "Build"
    displayName: "Build Stage"
    jobs:
      - job: "BuildApp"
        displayName: "Build ASP.NET Core 8 Application"
        steps:
          # ✅ Install .NET Core SDK
          - task: UseDotNet@2
            displayName: "Install .NET Core SDK"
            inputs:
              version: "$(dotnetVersion)"
              performMultiLevelLookup: true
              includePreviewVersions: true

          # ✅ Restore Dependencies
          - task: DotNetCoreCLI@2
            displayName: "Restore Dependencies"
            inputs:
              command: "restore"
              project: "$(mainProjectLocation)"

          # ✅ Build the Project
          - task: DotNetCoreCLI@2
            displayName: "dotnet build $(buildConfiguration)"
            inputs:
              command: "build"
              project: "$(mainProjectLocation)"
              arguments: "--configuration $(buildConfiguration)"

          # ✅ Run Unit Tests
          - task: DotNetCoreCLI@2
            displayName: "Run Unit Tests"
            inputs:
              command: test
              project: "$(testProjectLocation)"
              arguments: "--configuration $(buildConfiguration)"

          # ✅ Publish the Project
          - task: DotNetCoreCLI@2
            displayName: "Publish Project"
            inputs:
              command: publish
              publishWebProjects: false
              project: "$(mainProjectLocation)"
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/backend-api"
              zipAfterPublish: True

          # ✅ Upload Artifact
          - task: PublishPipelineArtifact@1
            displayName: "Generate Artifact File"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/backend-api"
              artifactName: "mybackend"

  - stage: "Dev"
    displayName: "Deploy to the Dev Environment"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: "Deploy"
        displayName: "Deploy to Azure App Service"
        steps:
          # ✅ Download the Published Artifact
          - task: DownloadPipelineArtifact@2
            displayName: "Download Artifact"
            inputs:
              artifact: "mybackend"
              path: "$(Pipeline.Workspace)/backend-api"

          # ✅ Deploy ZIP to Azure App Service
          - task: AzureWebApp@1
            displayName: "Deploy to Azure App Service"
            inputs:
              azureSubscription: "$(azureSubscription)"
              resourceGroupName: "devops-dev"
              appName: "university-management-system-dev"
              appType: "webAppLinux" # ✅ Use 'webApp' for Linux-based App Services
              package: "$(Pipeline.Workspace)/backend-api/backend-api.zip"
